# Backend for the portfolio terminal. Intended for a sub-domain such as terminal.yourdomain.com
# (the React site can stay on Vercel/Netlify). See deploy/README.md for the single-domain variant.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=term_http:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=term_ws:10m   rate=20r/m;
limit_req_zone $binary_remote_addr zone=term_api:10m  rate=10r/m;

upstream portfolio_terminal {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name terminal.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name terminal.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/terminal.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 16k;

    # Browser terminal (WebSocket)
    location /ws/terminal {
        limit_req zone=term_ws burst=10 nodelay;
        proxy_pass http://portfolio_terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Contact API
    location = /api/contact {
        limit_req zone=term_api burst=5 nodelay;
        proxy_pass http://portfolio_terminal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    # curl endpoints: curl https://terminal.yourdomain.com/terminal/about
    location /terminal/ {
        limit_req zone=term_http burst=10 nodelay;
        proxy_pass http://portfolio_terminal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://portfolio_terminal;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------------------------
# SINGLE-DOMAIN VARIANT (Nginx serves the built Vite app AND proxies the terminal):
#   - serve `dist/` as root with `try_files $uri /index.html;`
#   - keep `location = /terminal { try_files /index.html =404; }`  (the React page)
#   - keep `location /terminal/` -> proxy (the curl endpoints), plus /ws/terminal and /api/contact above
# SSH is NOT proxied: it listens directly on TCP :2222 (open it in your firewall).
# ---------------------------------------------------------------------------------------------
